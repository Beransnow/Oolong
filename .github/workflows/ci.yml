name: CI

# Every push and pull request is checked and built; a push's release build goes to the owner on
# Telegram. Tags are left to release.yml.
on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "zulu"

      # Pull requests from forks get no secrets, and build with the debug key
      - name: Release key
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: tools/release/ci-signing.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check, test and build
        run: ./gradlew ktlintCheck verifyRoborazziDebug testDebugUnitTest lintDebug :app:assembleRelease

      - name: Find the APK
        id: apk
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$apk" .apk)" >> "$GITHUB_OUTPUT"

      # With the release key, the APK must carry it: a silent fall back to the debug key would
      # make an APK that installs over nothing
      - name: Check the signature
        if: hashFiles('keystore.properties') != ''
        run: python3 tools/release/publish.py "${{ steps.apk.outputs.path }}" --check

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      - name: Upload the mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.apk.outputs.name }}
          path: app/build/outputs/mapping/release

      - name: Send to the owner
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip post]')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_OWNER_ID" ]; then exit 0; fi
          python3 tools/release/telegram.py --chat "$TELEGRAM_OWNER_ID" --apk "${{ steps.apk.outputs.path }}" \
            --caption "$(printf '%s · %s\n\n%s\n\n%s' "$GITHUB_REF_NAME" "${GITHUB_SHA::8}" "$MESSAGE" "$RUN_URL")"

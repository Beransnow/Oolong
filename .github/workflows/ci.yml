name: CI

# Every push and pull request is checked and built, on two runners at once; once both pass, a
# push's release build goes to the owner on Telegram. Tags are left to release.yml.
on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Debug only: the style, the unit tests and lint
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "zulu"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The runners of a private repository have about 8 GB, less than the project's own settings
      # ask for; past that the runner is killed mid-build and the run shows as canceled
      - name: Fit Gradle to the runner
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' 'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' 'kotlin.daemon.jvmargs=-Xmx2g' >> ~/.gradle/gradle.properties

      - name: Check and test
        run: ./gradlew ktlintCheck testDebugUnitTest lintDebug -PskipScreenshots

  # The screenshots against the committed references. Intended changes often land before their
  # references are recorded, so a mismatch marks this job but not the run; release.yml requires it
  screenshots:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "zulu"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The runners of a private repository have about 8 GB, less than the project's own settings
      # ask for; past that the runner is killed mid-build and the run shows as canceled
      - name: Fit Gradle to the runner
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' 'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' 'kotlin.daemon.jvmargs=-Xmx2g' >> ~/.gradle/gradle.properties

      - name: Compare
        run: ./gradlew :app:verifyRoborazziDebug --tests '*ScreenshotTest'

      - name: List the changed screenshots
        if: failure()
        run: |
          {
            echo "### Screenshots that changed"
            echo
            for f in app/build/outputs/roborazzi/*_compare.png; do
              [ -e "$f" ] || continue
              name=$(basename "$f" _compare.png)
              echo "- \`${name#oolong.client.}\`"
            done
            echo
            echo 'If the change is intended, run `./gradlew recordRoborazziDebug` and commit the references.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the comparisons
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: app/build/outputs/roborazzi/*_compare.png

  # Release only: the APK the owner gets
  build:
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.apk.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "zulu"

      # Pull requests from forks get no secrets, and build with the debug key
      - name: Release key
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: tools/release/ci-signing.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The runners of a private repository have about 8 GB, less than the project's own settings
      # ask for; past that the runner is killed mid-build and the run shows as canceled
      - name: Fit Gradle to the runner
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' 'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' 'kotlin.daemon.jvmargs=-Xmx2g' >> ~/.gradle/gradle.properties

      - name: Build
        run: ./gradlew :app:assembleRelease

      - name: Find the APK
        id: apk
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$apk" .apk)" >> "$GITHUB_OUTPUT"

      # With the release key, the APK must carry it: a silent fall back to the debug key would
      # make an APK that installs over nothing
      - name: Check the signature
        if: hashFiles('keystore.properties') != ''
        run: python3 tools/release/publish.py "${{ steps.apk.outputs.path }}" --check

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      - name: Upload the mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.apk.outputs.name }}
          path: app/build/outputs/mapping/release

  send:
    needs: [ check, build ]
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip post]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk }}
          path: apk

      - name: Send to the owner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_OWNER_ID" ]; then exit 0; fi
          python3 tools/release/telegram.py --chat "$TELEGRAM_OWNER_ID" --apk "apk/${{ needs.build.outputs.apk }}.apk" \
            --caption "$(printf '%s · %s\n\n%s\n\n%s' "$GITHUB_REF_NAME" "${GITHUB_SHA::8}" "$MESSAGE" "$RUN_URL")"

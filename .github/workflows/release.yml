name: Release

# A tag v<versionName> publishes that version: the APK, signed with the release key, goes to the
# in-app updater's channel with tools/release/notes/<versionName>.json, to a GitHub release, and to
# the group on Telegram. Pre-releases go to the beta channel, releases to stable.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "zulu"

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REQUIRE_SIGNING: "1"
        run: tools/release/ci-signing.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Test and build
        run: ./gradlew testDebugUnitTest :app:assembleRelease

      # The APK must be Oolong, carry the release key and be the version the tag names, and the
      # version needs its notes, before anything is published
      - name: Check the release
        id: release
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          version=$(python3 tools/release/publish.py "$apk" --check)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag $GITHUB_REF_NAME doesn't match the version $version"
            exit 1
          fi
          notes="tools/release/notes/$version.json"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is missing"
            exit 1
          fi
          case "$version" in *-*) channel=beta ;; *) channel=stable ;; esac
          {
            echo "apk=$apk"
            echo "version=$version"
            echo "notes=$notes"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

      - name: Keep the mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.release.outputs.version }}
          path: app/build/outputs/mapping/release
          retention-days: 400

      - name: Publish to the updater
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 tools/release/publish.py "${{ steps.release.outputs.apk }}" \
            --channel "${{ steps.release.outputs.channel }}" --notes "${{ steps.release.outputs.notes }}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          cp "${{ steps.release.outputs.apk }}" "oolong-$VERSION.apk"
          python3 tools/release/notes.py "${{ steps.release.outputs.notes }}" > notes.md
          gh release create "$GITHUB_REF_NAME" "oolong-$VERSION.apk" --title "Oolong $VERSION" --notes-file notes.md \
            $([ "$CHANNEL" = beta ] && echo --prerelease)

      - name: Announce in the group
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_GROUP_ID" ]; then exit 0; fi
          python3 tools/release/telegram.py --chat "$TELEGRAM_GROUP_ID" --apk "oolong-$VERSION.apk" \
            --caption "Oolong $VERSION" --notes "${{ steps.release.outputs.notes }}"

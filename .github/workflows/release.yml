name: Release

# A tag v<versionName> publishes that version: the APK CI built for the tagged commit, signed with
# the release key, goes to the in-app updater's channel with tools/release/notes/<versionName>.json,
# to a GitHub release, and to the group on Telegram. Pre-releases go to the beta channel, releases to stable.
# Run by hand with a tag that exists, it publishes that tag with this workflow and tools as they are now.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to publish, such as v1.0.0
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The tagged commit must have passed CI on main, whose build is the APK published here
      - name: Take the build from CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          run=$(gh run list -R "$GITHUB_REPOSITORY" -w CI -c "$sha" -s success -L 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run" ]; then
            echo "::error::CI hasn't passed for $sha; push it to main and wait for CI before tagging"
            exit 1
          fi
          # CI passes with mismatched screenshots; a release needs them recorded
          screenshots=$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json jobs --jq '.jobs[] | select(.name == "screenshots") | .conclusion')
          if [ "$screenshots" != "success" ]; then
            echo "::error::the screenshots don't match in CI run $run; record the intended ones before tagging"
            exit 1
          fi
          gh run download "$run" -R "$GITHUB_REPOSITORY" -D ci

      # The APK must be Oolong, carry the release key and be the version the tag names, and the
      # version needs its notes, before anything is published. CI's build adds +<commit> to its
      # version name; the tag, the notes and the release go by the version before it
      - name: Check the release
        id: release
        run: |
          apk=$(ls ci/*/*.apk)
          build=$(python3 tools/release/publish.py "$apk" --check)
          version=${build%%+*}
          if [ "v$version" != "$TAG" ]; then
            echo "::error::the tag $TAG doesn't match the version $build"
            exit 1
          fi
          notes="tools/release/notes/$version.json"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is missing"
            exit 1
          fi
          case "$version" in *-*) channel=beta ;; *) channel=stable ;; esac
          {
            echo "apk=$apk"
            echo "version=$version"
            echo "notes=$notes"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

      - name: Keep the mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.release.outputs.version }}
          path: ci/mapping-*/
          retention-days: 400

      - name: Publish to the updater
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 tools/release/publish.py "${{ steps.release.outputs.apk }}" \
            --channel "${{ steps.release.outputs.channel }}" --notes "${{ steps.release.outputs.notes }}"

      # The crash Worker keeps the mapping of released builds longer (tools/crash-reports)
      - name: Mark the build released for crash reports
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then exit 0; fi
          python3 tools/crash-reports/scripts/upload.py released "${{ steps.release.outputs.apk }}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          cp "${{ steps.release.outputs.apk }}" "oolong-$VERSION.apk"
          python3 tools/release/notes.py "${{ steps.release.outputs.notes }}" > notes.md
          gh release create "$TAG" "oolong-$VERSION.apk" --title "Oolong $VERSION" --notes-file notes.md \
            $([ "$CHANNEL" = beta ] && echo --prerelease)

      - name: Announce in the group
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_GROUP_ID" ]; then exit 0; fi
          apk="oolong-$VERSION.apk"
          python3 tools/release/telegram.py --chat "$TELEGRAM_GROUP_ID" --apk "$apk" \
            --caption-html "$(python3 tools/release/caption.py "$apk" "$VERSION" "$CHANNEL")" \
            --notes "${{ steps.release.outputs.notes }}"
